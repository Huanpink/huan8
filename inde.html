/* V13.1 - Similarity audit. Evidence before suggestions. */
.sim-audit{background:#0b192a;border:1px solid #446283;border-radius:11px;margin:9px 0 12px;padding:10px;}
.sim-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sim-title{color:#f7ca7d;font-size:11px;letter-spacing:.2px;font-weight:850}
.sim-sub{color:#9cb5d6;font-size:10px;line-height:1.35;margin:5px 0 8px}
.sim-row{border-top:1px solid #284261;padding:7px 0 5px;display:grid;grid-template-columns:55px 1fr;gap:7px;align-items:start}
.sim-key{font-size:10px;color:#d4e8fa;font-weight:800;overflow-wrap:anywhere}
.sim-data{font-size:10px;color:#c6d7ee;line-height:1.5}
.sim-data b{font-size:12px;color:#fff}
.sim-chip{border-radius:5px;background:#203952;padding:2px 6px;display:inline-block;font-size:9px;color:#bcd5ec}
.sim-note{font-size:9px;color:#9db5cb;line-height:1.45;margin-top:6px}
.sim-none{font-size:10px;color:#b5c8dd}
@media(max-width:380px){.sim-row{grid-template-columns:46px 1fr;gap:5px}.sim-data{font-size:9px}}

/* V13.2 · 4 cột quan sát, các rule điều kiện chỉ báo thử */
.fourcol-panel{border:1px solid #405d7c;border-radius:10px;background:#0c1a2d;padding:9px;margin:9px 0}
.fourcol-title{display:flex;align-items:center;justify-content:space-between;gap:7px;color:#f6c879;font-weight:850;font-size:11px;margin-bottom:5px}
.fourcol-sub{font-size:10px;color:#a4b8d3;line-height:1.5;margin:5px 0 7px}
.fourcol-card{background:#11243c;border:1px solid #314c6a;border-radius:8px;margin:6px 0;padding:8px}
.fourcol-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fourcol-head b{font-size:11px}.fourcol-dir{font-size:10px;font-weight:900;padding:3px 7px;border-radius:6px;color:#fff;background:#1f60ab}
.fourcol-dir.B{background:#9b344f}
.fourcol-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:6px}
.fourcol-stat{border:1px solid #294661;border-radius:6px;padding:4px 5px;min-width:0}
.fourcol-stat small{display:block;font-size:9px;color:#a5bbd5;line-height:1.2}
.fourcol-stat strong{font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.fourcol-stat span{display:block;font-size:9px;color:#c1cee0;white-space:nowrap}
.fourcol-open{font-size:10px;color:#aaccf1;cursor:pointer;margin:6px 0 2px}
.fourcol-more{font-size:10px;color:#bccce1;line-height:1.5;border-top:1px solid #334965;padding-top:6px}
.fourcol-empty{padding:5px 0 3px;font-size:10px;color:#abc2df}
.fourcol-tape{display:flex;gap:3px;flex-wrap:wrap;margin:4px 0}
.fourcol-tape .chip{font-size:9px}
@media(max-width:360px){.fourcol-stat strong{font-size:12px}.fourcol-grid{gap:3px}.fourcol-stat{padding:3px}}

/* V13.3 — voting panel, compact mobile reading */

.vote-panel .status{margin:1px 0 7px;padding:8px 10px}

.voting-head,.voting-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 3px;flex-wrap:wrap;font-size:10px}
.voting-head{border-bottom:1px solid #30455f;color:#cadcf1}
.voting-row{border-bottom:1px solid #273950}
.voting-row b{font-variant-numeric:tabular-nums;color:#fff}
.vote-side{font-weight:800;color:#9ccaff}
.voting-foot{font-size:9px;color:#b4c7e1;line-height:1.5;padding:6px 3px}
.compact-hit{border-bottom:1px solid #2d4058;padding:7px 2px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px}

function geoCell(m,c,row,n){
 if(c<0||row<1||row>6)return null;
 const pos=c*6+row;
 return pos>=n?null:m.get(pos)||null;
}
function geoConditionOK(m,n,col,k,str){
 if(!str)return true;
 const parts=str.split('=');const key=parts[0],value=parts.slice(1).join('=');
 const prev=Array.from({length:6},(_,i)=>geoCell(m,col-1,i+1,n));
 const nP=prev.filter(x=>x==='P').length,nB=prev.filter(x=>x==='B').length;
 if(key==='truoc_col_P')return nP===Number(value);
 if(key==='truoc_hang6_PB')return prev[5]===(value==='2'?'B':value==='1'?'P':'H');
 if(key==='truoc_lonB')return (nB>nP)===(value==='True');
 if(key==='k_hang')return k===Number(value);
 if(key==='k_chan_le')return k%2===Number(value);
 if(key==='gan_nhat_PB')return m.get(n-1)===(value==='1'?'P':value==='2'?'B':'H');
 if(key==='chuoi_PB'){
  let run=0,prevSide=null;
  for(let z=n-1;z>=Math.max(1,n-24);z--){const x=m.get(z);if(x!=='P'&&x!=='B')break;if(prevSide!==null&&x!==prevSide)break;run++;prevSide=x;}
  return Math.min(5,run)===Number(value);
 }
 return false;
}
function geoReference(m,n,col,k,ref){
 let mm=/^c(-[123])_r([1-6])$/.exec(ref||'');
 if(mm)return geoCell(m,col+Number(mm[1]),Number(mm[2]),n);
 mm=/^same_row_c(-[123])$/.exec(ref||'');
 if(mm)return geoCell(m,col+Number(mm[1]),k,n);
 if(ref==='last')return m.get(n-1);
 if(ref==='last2')return m.get(n-2);
 return null;
}
function geoScan(m,n){
 const col=Math.floor((n-1)/6),k=(n-1)%6+1;
 if(col<3)return [];
 const hits=[];
 for(const r of GEO_RULES){
  const values=[];let valid=true;
  for(const [dx,row] of r.shape){const v=geoCell(m,col+dx,row,n);if(v!=='P'&&v!=='B'){valid=false;break;}values.push(v);}
  if(!valid)continue;
  const countB=values.filter(v=>v==='B').length;
  let cat;
  if(r.mode==='count')cat=countB;
  else if(r.mode==='parity')cat=countB%2;
  else if(r.mode==='switch')cat=values.slice(1).filter((v,i)=>v!==values[i]).length;
  else if(r.mode==='exact')cat=values.reduce((sum,v,i)=>sum+(v==='B'?2**i:0),0);
  else continue;
  if(cat!==r.category||!geoConditionOK(m,n,col,k,r.cond))continue;
  const ref=r.kind==='relative'?geoReference(m,n,col,k,r.reference):null;
  const pred=r.kind==='relative'?(r.flip?(ref==='P'?'B':ref==='B'?'P':null):ref):r.pred;
  if(pred!=='P'&&pred!=='B')continue;
  hits.push({id:r.id,pred,family:r.family});
 }
 return hits;
}

function geoGroups(hits){
 const groups=new Map();
 for(const h of hits){const r=GEO_BY_ID.get(h.id);if(!r)continue;const a=groups.get(r.family)||[];a.push(h);groups.set(r.family,a);}
 let P=0,B=0,mixed=0;
 for(const arr of groups.values()){
  const sides=new Set(arr.map(x=>x.pred));
  if(sides.size>1)mixed++;
  else if(sides.has('P'))P++;
  else if(sides.has('B'))B++;
 }
 return {P,B,mixed,families:groups.size,patterns:hits.length,side:P>0&&B===0&&mixed===0?'P':B>0&&P===0&&mixed===0?'B':null};
}
function geoRecorded(b,id,limit=Infinity){
 const hits=[];
 for(const l of b?.logs||[]){
  if(l.geoVersion!==GEO_VERSION||Number(l.n)>=limit)continue;
  for(const hit of l.geoSignals||[]){
   if(hit.id===id&&['D','S','H'].includes(hit.grade))hits.push({id,grade:hit.grade,n:Number(l.n),pred:hit.pred});
  }
 }
 return hits.sort((a,b)=>a.n-b.n);
}

 s+='<div class="subheading">NGUỒN THỐNG KÊ</div><div class="note">744 ván lịch sử (17 chuỗi); 452 ván sao lưu (10 bàn sau lọc trùng, gồm 63 ván mới nhất). Mỗi rule có công thức được kiểm tra khớp lại với dữ liệu. 31 rule đều là ứng viên nghiên cứu, không bảo đảm kết quả ván sau.</div>';
 return s;}
function initHeader(v){el('roundTag').textContent=(v.inspection?'Xem #':'Ván #')+v.n;el('boardSelect').innerHTML=app.boards.map(b=>'<option value="'+escapeHtml(b.id)+'">'+escapeHtml(b.name)+' · '+b.rounds.length+' ván</option>').join('');el('boardSelect').value=app.currentId;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===app.tab));}
function render(){const v=app.tab==='entry'||app.tab==='signals'?displayedModel():currentModel();el('app').classList.toggle('compact-mode',app.tab==='entry');initHeader(v);for(const t of ['entry','signals','stats','road','settings']){const p=el('view-'+t);p.classList.toggle('active',app.tab===t);if(app.tab!==t)continue;p.innerHTML='<section class="panel">'+(t==='entry'?entryHtml(v):t==='signals'?signalsHtml(v):t==='stats'?statsHtml(v):t==='road'?roadPanelHtml(v):settingsHtml(v))+'</section>';}
 document.querySelectorAll('.roadwrap').forEach(e=>{e.scrollLeft=e.scrollWidth});}
function addBoard(){inspectRound=null;const name=prompt('Tên bàn mới:', 'Bàn '+(app.boards.length+1));if(name===null)return;const b=emptyBoard(name.trim()||'Bàn mới');app.boards.push(b);app.currentId=b.id;app.tab='entry';persist();render();}
function renameBoard(){const b=board(),name=prompt('Tên bàn:',b.name);if(name===null||!name.trim())return;b.name=name.trim().slice(0,70);persist();render();}
function startAt(){const b=board();if(b.rounds.length){toast('Chỉ đặt lại số bắt đầu khi bàn trống.');return;}const s=prompt('Bắt đầu ở ván số mấy?',String(b.start));if(s===null)return;const n=Number(s);if(!Number.isSafeInteger(n)||n<1){toast('Số ván không hợp lệ');return;}b.start=n;persist();render();}
function clearBoard(){inspectRound=null;const b=board();if(!confirm('Xóa toàn bộ ván và nhật ký của bàn '+b.name+'?'))return;b.rounds=[];b.logs=[];persist();render();}
function deleteBoard(){inspectRound=null;if(app.boards.length<=1){toast('Cần giữ ít nhất một bàn');return;}if(!confirm('Xóa bàn '+board().name+'?'))return;app.boards=app.boards.filter(b=>b.id!==app.currentId);app.currentId=app.boards[0].id;persist();render();}
function download(name,obj){const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportJson(){download('31_TN_Tinhieu_V13_14_'+new Date().toISOString().slice(0,10)+'.json',{format:'baccarat-tn-multitab',version:13,toolBuild:'13.14',voteMode:app.voteMode,exportedAt:new Date().toISOString(),boards:app.boards,enabled:app.enabled,currentId:app.currentId});}
function absorbBoard(b){const old=app.boards.find(x=>x.id===b.id);
 if(old){const a=old.rounds,now=b.rounds;const overlap=Math.min(a.length,now.length);const samePrefix=a.slice(0,overlap).every((r,i)=>r.n===now[i].n&&r.v===now[i].v);
  if(samePrefix){if(now.length>a.length){
   const logMap=new Map((b.logs||[]).map(l=>[Number(l.n),l]));
   for(const l of old.logs||[]){const key=Number(l.n);if(Number(l.ruleVersion)===13||!logMap.has(key))logMap.set(key,l);}
   const validNums=new Set(now.map(r=>r.n));old.rounds=now;old.logs=[...logMap.values()].filter(l=>validNums.has(Number(l.n))).sort((x,y)=>Number(x.n)-Number(y.n));old.start=b.start;
  }return false;}
  b.name=b.name+' · phiên khác';b.id=emptyBoard().id;
 }
 if(app.boards.some(x=>x.start===b.start&&x.rounds.length===b.rounds.length&&x.rounds.length>0&&x.rounds.every((r,i)=>r.n===b.rounds[i].n&&r.v===b.rounds[i].v)))return false;
 app.boards.push(b);return true;
}
async function importJson(file){try{const data=JSON.parse(await file.text());if(!Array.isArray(data.boards))throw new Error('JSON không có danh sách boards');const bs=validateBoards(data.boards).filter(b=>b.rounds.length);if(!bs.length)throw new Error('Không có ván hợp lệ');if(!confirm('Nhập '+bs.length+' bàn? Tool tự gộp bản cùng ID, không nhập trùng ván.'))return;
 let count=0;for(const b of bs)if(absorbBoard(b))count++;if(data.version===13&&['13.3','13.4','13.5','13.6','13.7','13.8','13.9','13.10','13.11','13.12','13.13'].includes(data.toolBuild)&&data.enabled&&typeof data.enabled==='object')app.enabled={...app.enabled,...data.enabled};if(['13.9','13.10','13.11','13.12','13.13'].includes(data.toolBuild)&&['full','filtered','adaptive'].includes(data.voteMode))app.voteMode=data.voteMode;app.currentId=bs[0].id&&app.boards.find(x=>x.id===bs[0].id)?bs[0].id:app.boards.at(-1).id;app.tab='entry';inspectRound=null;persist();render();toast('Đã xử lý '+bs.length+' bàn, thêm '+count+' bàn mới');
 }catch(e){toast('Lỗi nhập: '+e.message);}}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;
 if(btn.dataset.inspectRound){inspectRound=Number(btn.dataset.inspectRound);app.tab='entry';render();return;}
 if(btn.id==='backNow'||btn.id==='backNowBottom'){inspectRound=null;app.tab='entry';render();return;}
 if(btn.id==='toggleRuleStats'){metricView=metricView==='board'?'pooled':metricView==='pooled'?'recorded':metricView==='recorded'?'research':'board';render();return;}
 if(btn.id==='inspectPrev'||btn.id==='inspectNext'){
  const seq=board().rounds.map(x=>x.n).sort((a,b)=>a-b),idx=seq.indexOf(inspectRound);
  if(btn.id==='inspectPrev'&&idx>0)inspectRound=seq[idx-1];
  else if(btn.id==='inspectNext'&&idx>=0&&idx+1<seq.length)inspectRound=seq[idx+1];
  else if(btn.id==='inspectNext'){inspectRound=null;app.tab='entry';}
  render();return;
 }
 if(btn.dataset.result){addResult(btn.dataset.result);return;}if(btn.dataset.tab){switchTab(btn.dataset.tab);return;}
 const id=btn.id;
 if(id==='chooseFiltered'||id==='chooseFull'||id==='chooseAdaptive'){app.voteMode=id==='chooseFull'?'full':id==='chooseFiltered'?'filtered':'adaptive';persist();render();toast('Bộ phiếu: '+(app.voteMode==='full'?'bộ 20 để đối chiếu':app.voteMode==='filtered'?'bộ 14 để đối chiếu':'tự điều chỉnh 31 rule'));return;}if(id==='addBoard')addBoard();else if(id==='undo')undo();else if(id==='changeScope'){app.statsScope=app.statsScope==='all'?'board':'all';persist();render();}else if(id==='renameBoard')renameBoard();else if(id==='setStart')startAt();else if(id==='clearBoard')clearBoard();else if(id==='deleteBoard')deleteBoard();else if(id==='exportJson')exportJson();else if(id==='importJson')el('jsonFile').click();
});
document.addEventListener('change',e=>{const input=e.target;if(input.id==='boardSelect'){app.currentId=input.value;inspectRound=null;persist();render();}
 else if(input.dataset.ruleToggle){app.enabled[input.dataset.ruleToggle]=input.checked;persist();render();toast(input.dataset.ruleToggle+(input.checked?' bật báo thử':' chỉ theo dõi'));}
 else if(input.id==='jsonFile'){const f=input.files[0];if(f)importJson(f);input.value='';}
});
persist();render();
</script></body></html>
